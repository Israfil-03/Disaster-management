<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline • AadhyaPath</title>
    <link rel="stylesheet" href="assets/landing.css" />
    <style>
      body{display:flex;min-height:100vh;align-items:center;justify-content:center;background:Canvas;color:CanvasText;font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;padding:24px}
      .box{max-width:600px;text-align:center}
      .box h1{font-size:1.5rem;margin:0 0 8px}
      .box p{opacity:0.8;margin:0 0 16px}
      .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
      .btn{border:1px solid #ccc;padding:.6rem 1rem;border-radius:.5rem;text-decoration:none;color:inherit}
    </style>
  </head>
  <body>
    <main class="box" role="main">
      <h1>You're offline</h1>
      <p>The app is not connected. You can still open cached pages and assets. When back online, the latest alerts and data will refresh automatically.</p>
      <div class="row">
        <a class="btn" href="index.html">Home</a>
        <a class="btn" href="AadhyaPath_dashboard.html">Dashboard</a>
      </div>
    </main>
  </body>
</html>
