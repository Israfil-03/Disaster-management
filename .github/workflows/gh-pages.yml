name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - "database_addition(only_login)"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build static site artifact (frontend only)
        run: |
          mkdir -p site
          rsync -av --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'server' \
            --exclude 'node_modules' \
            ./ site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
