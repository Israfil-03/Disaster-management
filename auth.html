<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Account • Disaster Management</title>
    <link rel="icon" href="assets/icons/app-mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/auth.css" />
  </head>
  <body>
    <main class="auth-shell">
      <a class="brand" href="landing.html" aria-label="Back to landing">
        <img src="assets/icons/app-mark.svg" alt="App mark" />
        <span>Disaster Management</span>
      </a>

      <section class="auth-card" aria-labelledby="auth-title">
        <header class="tabs" role="tablist">
          <button id="tab-login" role="tab" aria-controls="panel-login" aria-selected="true" class="tab">Log In</button>
          <button id="tab-signup" role="tab" aria-controls="panel-signup" aria-selected="false" class="tab">Sign Up</button>
        </header>

        <div class="panels">
          <form id="panel-login" role="tabpanel" aria-labelledby="tab-login" class="panel" autocomplete="on">
            <h1 id="auth-title">Welcome back</h1>
            <div class="field">
              <label for="login-email">Email</label>
              <input id="login-email" name="email" type="email" inputmode="email" placeholder="you@example.com" required />
            </div>
            <div class="field">
              <label for="login-password">Password</label>
              <input id="login-password" name="password" type="password" placeholder="••••••••" minlength="6" required />
            </div>
            <button class="btn btn-primary" type="submit">Log In</button>
            <p class="muted small">New here? <a href="#" id="link-to-signup">Create an account</a>.</p>
          </form>

          <form id="panel-signup" role="tabpanel" aria-labelledby="tab-signup" class="panel hidden" autocomplete="on">
            <h1>Create your account</h1>
            <div class="field">
              <label for="signup-name">Full name</label>
              <input id="signup-name" name="name" type="text" placeholder="Alex Sharma" required />
            </div>
            <div class="field">
              <label for="signup-email">Email</label>
              <input id="signup-email" name="email" type="email" inputmode="email" placeholder="you@example.com" required />
            </div>
            <div class="field">
              <label for="signup-password">Password</label>
              <input id="signup-password" name="password" type="password" placeholder="At least 6 characters" minlength="6" required />
            </div>
            <div class="field">
              <label for="signup-confirm">Confirm password</label>
              <input id="signup-confirm" name="confirm" type="password" placeholder="Repeat password" minlength="6" required />
            </div>
            <button class="btn btn-primary" type="submit">Create account</button>
            <p class="muted small">Already have an account? <a href="#" id="link-to-login">Log in</a>.</p>
          </form>
        </div>
      </section>

      <p class="legal muted">By continuing, you agree to our Terms and acknowledge our Privacy Policy.</p>
    </main>

    <script src="assets/auth.js"></script>
  </body>
  </html>
